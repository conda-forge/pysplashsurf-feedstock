schema_version: 1

context:
  name: pysplashsurf
  version: "0.14.1.0"
  tag: "v0.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/InteractiveComputerGraphics/splashsurf/archive/refs/tags/${{ tag }}.tar.gz
  sha256: 95f140816d1b0038af9afeb6b57984820badfd960db8bb95968aff02dfc42e73
  patches:
    # Upstream .cargo/config.toml sets target-cpu=native, so the binary only
    # runs on CPUs like the build machine (e.g. AVX-512). Remove this patch
    # once upstream drops it from .cargo/config.toml:
    # https://github.com/InteractiveComputerGraphics/splashsurf/issues/243
    - 0001-drop-target-cpu-native.patch

build:
  number: 3
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cd pysplashsurf
    - if: linux
      then:
        - export CARGO_BUILD_JOBS=1
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1,<2
    - numpy
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - pysplashsurf
  - script:
      - pip check
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python
  # Guard: the linux-64 extension must not contain AVX-512 instructions.
  - if: linux and x86_64
    then:
      script:
        - python check_no_avx512.py
      files:
        recipe:
          - check_no_avx512.py
      requirements:
        run:
          - binutils
          - python

about:
  homepage: https://splashsurf.physics-simulation.org/
  summary: Python bindings for splashsurf, a surface reconstruction library for SPH simulations.
  description: |
    pySplashsurf provides Python bindings for splashsurf, an open source
    surface reconstruction library for particle data from SPH simulations.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://pysplashsurf.readthedocs.io/
  repository: https://github.com/InteractiveComputerGraphics/splashsurf

extra:
  recipe-maintainers:
    - jeongseok-meta
